name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BATS_VERSION: 1.11.1
  BATS_SHA256: 5c57ed9616b78f7fd8c553b9bae3c7c9870119edd727ec17dbd1185c599f79d9
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  SHFMT_VERSION: 3.10.0
  SHFMT_SHA256: 1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  checks:
    name: Bash checks (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned development tools
        run: |
          tools_dir="$RUNNER_TEMP/logshuru-tools"
          mkdir -p "$tools_dir/bin"

          curl --fail --silent --show-error --location \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            --output "$tools_dir/bats.tar.gz"
          printf '%s  %s\n' "$BATS_SHA256" "$tools_dir/bats.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools_dir/bats.tar.gz" -C "$tools_dir"
          "$tools_dir/bats-core-${BATS_VERSION}/install.sh" "$tools_dir"

          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$tools_dir/shellcheck.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tools_dir/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "$tools_dir/shellcheck.tar.xz" -C "$tools_dir"
          install -m 755 "$tools_dir/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$tools_dir/bin/shellcheck"

          curl --fail --silent --show-error --location \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            --output "$tools_dir/bin/shfmt"
          printf '%s  %s\n' "$SHFMT_SHA256" "$tools_dir/bin/shfmt" | sha256sum --check --strict
          chmod +x "$tools_dir/bin/shfmt"
          printf '%s\n' "$tools_dir/bin" >> "$GITHUB_PATH"

      - name: Report environment and tool versions
        run: |
          bash --version
          date --version
          shellcheck --version
          shfmt --version
          bats --version
          script --version
          jq --version

      - name: Check Bash syntax
        run: |
          for file in logshuru.sh examples/*.sh tests/*.bash tests/fixtures/*.bash; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        run: shellcheck logshuru.sh examples/*.sh tests/*.bats tests/*.bash tests/fixtures/*.bash

      - name: Check Bash formatting
        run: shfmt -ln bash -d logshuru.sh examples/*.sh tests/*.bash tests/fixtures/*.bash

      - name: Check Bats formatting
        run: shfmt -ln bats -d tests/*.bats

      - name: Run Bats tests
        run: bats tests

  runtime:
    name: Bash ${{ matrix.bash }} runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bash: '4.2'
            sha256: a27a1179ec9c0830c65c6aa5d7dab60f7ce1a2a608618570f96bfa72e95ab3d8
          - bash: '4.4'
            sha256: d86b3392c1202e8ff5a423b302e6284db7f8f435ea9f39b5b1b20fd3ac36dfcb
          - bash: '5.2'
            sha256: a139c166df7ff4471c5e0733051642ee5556c1cc8a4a78f145583c5c81ab32fb
    defaults:
      run:
        shell: bash
    env:
      BASH_VERSION_TO_BUILD: ${{ matrix.bash }}
      BASH_SHA256: ${{ matrix.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download and verify Bash and Bats sources
        run: |
          tools_dir="$RUNNER_TEMP/logshuru-tools"
          mkdir -p "$tools_dir/bin"
          curl --fail --silent --show-error --location \
            "https://ftp.gnu.org/gnu/bash/bash-${BASH_VERSION_TO_BUILD}.tar.gz" \
            --output "$tools_dir/bash.tar.gz"
          printf '%s  %s\n' "$BASH_SHA256" "$tools_dir/bash.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools_dir/bash.tar.gz" -C "$tools_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            --output "$tools_dir/bats.tar.gz"
          printf '%s  %s\n' "$BATS_SHA256" "$tools_dir/bats.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools_dir/bats.tar.gz" -C "$tools_dir"
          "$tools_dir/bats-core-${BATS_VERSION}/install.sh" "$tools_dir"

      - name: Build the selected Bash interpreter
        working-directory: ${{ runner.temp }}/logshuru-tools/bash-${{ matrix.bash }}
        run: |
          ./configure --without-bash-malloc --disable-nls
          make -j2
          install -m 755 bash "$RUNNER_TEMP/logshuru-tools/bin/bash"
          printf '%s\n' "$RUNNER_TEMP/logshuru-tools/bin" >> "$GITHUB_PATH"

      - name: Verify interpreter and run the full suite
        run: |
          bash --version
          [[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == "$BASH_VERSION_TO_BUILD" ]]
          date --version
          bats --version
          jq --version
          script --version
          for file in logshuru.sh examples/*.sh tests/*.bash tests/fixtures/*.bash; do
            bash -n "$file"
          done
          bats tests
